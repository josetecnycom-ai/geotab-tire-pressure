<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Monitor Neumáticos</title>
    <style>
        /* Estilos generales y cuadrícula */
        body { background: #f4f7f6; padding: 20px; font-family: sans-serif; }
        .fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .vehicle-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; }
        .card-header { font-size: 15px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #eee; }
        
        /* Alertas de texto */
        .alert-box { color: #eb3b5a; font-size: 11px; font-weight: bold; background: #ffeaa7; padding: 6px; border-radius: 4px; margin-bottom: 15px; }



        .stats-box { font-size: 10px; color: #636e72; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="tirePressureAddin">
        <header class="geotabPageHeader">
            <h1 class="geotabPageName" style="font-family: sans-serif; margin-bottom: 20px;">Control de Neumáticos (Bar)</h1>
        </header>
        <div id="fleet-container">Cargando interfaz visual...</div>
    </div>
    <script src="main.js"></script>
</body>
</html>
