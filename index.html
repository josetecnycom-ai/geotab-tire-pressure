<style>
    body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
    .fleet-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
        gap: 20px; 
    }
    .vehicle-card { 
        background: white; border-radius: 10px; padding: 15px; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;
    }
    .card-header { border-bottom: 1px solid #eee; margin-bottom: 10px; padding-bottom: 5px; font-size: 14px; }
    .car-diagram { 
        position: relative; width: 50px; height: 80px; 
        margin: 0 auto; background: #dfe6e9; border-radius: 10px; 
    }
    .car-body-shape { width: 100%; height: 100%; border-radius: 10px; border: 2px solid #b2bec3; }
    .tire-ui { 
        position: absolute; width: 10px; height: 18px; 
        border-radius: 2px; border: 1px solid #2d3436; 
    }
    .stats-box { font-size: 10px; margin-top: 10px; color: #636e72; font-family: monospace; }
</style>
